<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Biddabari AI Tutor</title>
<style>
  :root {
    --brand: #1a7f5a;
    --brand-dark: #14603f;
    --bg: #f4f6f5;
    --bubble-bot: #ffffff;
    --bubble-user: #1a7f5a;
    --text: #1f2a24;
    --muted: #6b7a72;
    --border: #e1e7e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans Bengali", "Hind Siliguri", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #chat-root {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  header {
    background: var(--brand);
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  header .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header .title { font-weight: 600; font-size: 15px; }
  header .subtitle { font-size: 12px; opacity: 0.85; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 82%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--bubble-user); color: white; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: var(--bubble-bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.bot.refusal .bubble { background: #fff6e8; border-color: #f2d8a8; }

  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .source-chip {
    font-size: 11.5px;
    color: var(--brand-dark);
    background: #e6f3ee;
    padding: 3px 9px;
    border-radius: 999px;
    text-decoration: none;
    border: 1px solid #cfe7dc;
  }

  .feedback { display: flex; gap: 6px; margin-top: 2px; }
  .feedback button {
    border: 1px solid var(--border);
    background: white;
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 13px;
    cursor: pointer;
    color: var(--muted);
  }
  .feedback button.active-up { background: #e6f3ee; border-color: var(--brand); color: var(--brand-dark); }
  .feedback button.active-down { background: #fdeceb; border-color: #e07a6e; color: #b23c2e; }

  .suggested {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 16px 10px;
  }
  .suggested button {
    border: 1px solid var(--border);
    background: white;
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }
  .suggested button:hover { border-color: var(--brand); color: var(--brand-dark); }

  #composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
    background: white;
  }
  #composer input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 11px 16px;
    font-size: 14.5px;
    outline: none;
    font-family: inherit;
  }
  #composer input:focus { border-color: var(--brand); }
  #composer button {
    background: var(--brand);
    color: white;
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #composer button:disabled { background: #b7cdc3; cursor: default; }

  .typing { display: flex; gap: 4px; padding: 10px 14px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .rate-limit-banner {
    background: #fdeceb;
    color: #8a2d20;
    font-size: 12.5px;
    padding: 8px 16px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="chat-root">
  <header>
    <div class="avatar">🎓</div>
    <div>
      <div class="title">Biddabari AI Tutor</div>
      <div class="subtitle">তোমার প্রশ্নের উত্তর সাথে সাথে</div>
    </div>
  </header>

  <div id="messages"></div>

  <div class="suggested" id="suggested-chips">
    <button data-q="কোর্স ফি কত?">কোর্স ফি কত?</button>
    <button data-q="ক্লাস রুটিন কী?">ক্লাস রুটিন কী?</button>
    <button data-q="রিফান্ড পলিসি কী?">রিফান্ড পলিসি কী?</button>
    <button data-q="পেমেন্ট কিভাবে করব?">পেমেন্ট কিভাবে করব?</button>
  </div>

  <form id="composer">
    <input id="question-input" type="text" placeholder="তোমার প্রশ্ন লেখো..." autocomplete="off" />
    <button type="submit" id="send-btn">➤</button>
  </form>
</div>

<script>
// -----------------------------------------------------------------------
// Minimal config. In production, inject API_BASE_URL at build/deploy time
// (or from your app's own config) rather than hardcoding it.
// -----------------------------------------------------------------------
const API_BASE_URL = window.BIDDABARI_API_BASE_URL || "http://127.0.0.1:8000";
const STORAGE_KEY = "biddabari_chat_history_v1";
const USER_ID_KEY = "biddabari_user_id";

function getUserId() {
  let id = localStorage.getItem(USER_ID_KEY);
  if (!id) {
    id = "guest_" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem(USER_ID_KEY, id);
  }
  return id;
}

function loadHistory() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  } catch (e) {
    return [];
  }
}

function saveHistory(history) {
  // keep last 30 days worth is a backend concern; client just keeps a
  // reasonable local cap so the page doesn't grow unbounded
  const trimmed = history.slice(-200);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
}

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("question-input");
const sendBtn = document.getElementById("send-btn");
const composer = document.getElementById("composer");
const suggestedEl = document.getElementById("suggested-chips");

let history = loadHistory();

function renderSources(sources) {
  if (!sources || !sources.length) return "";
  return `<div class="sources">${sources
    .map(
      (s) =>
        `<a class="source-chip" href="${s.url}" target="_blank" rel="noopener">${escapeHtml(
          s.title
        )}</a>`
    )
    .join("")}</div>`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderMessage(msg) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + msg.role + (msg.was_refusal ? " refusal" : "");

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = msg.text;
  wrap.appendChild(bubble);

  if (msg.role === "bot") {
    if (msg.sources && msg.sources.length) {
      const srcDiv = document.createElement("div");
      srcDiv.innerHTML = renderSources(msg.sources);
      wrap.appendChild(srcDiv.firstChild);
    }
    if (msg.question_id) {
      const fb = document.createElement("div");
      fb.className = "feedback";
      fb.innerHTML = `
        <button data-fb="up" data-qid="${msg.question_id}">👍</button>
        <button data-fb="down" data-qid="${msg.question_id}">👎</button>
      `;
      wrap.appendChild(fb);
    }
  }

  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}

function renderTyping() {
  const wrap = document.createElement("div");
  wrap.className = "msg bot";
  wrap.id = "typing-indicator";
  wrap.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

async function sendQuestion(question) {
  if (!question.trim()) return;

  const userMsg = { role: "user", text: question };
  history.push(userMsg);
  renderMessage(userMsg);
  saveHistory(history);

  inputEl.value = "";
  sendBtn.disabled = true;
  renderTyping();

  try {
    const resp = await fetch(`${API_BASE_URL}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, user_id: getUserId() }),
    });

    removeTyping();

    if (resp.status === 429) {
      const banner = document.createElement("div");
      banner.className = "rate-limit-banner";
      banner.textContent = "তুমি অনেকগুলো প্রশ্ন করে ফেলেছো। কিছুক্ষণ পর আবার চেষ্টা করো।";
      messagesEl.appendChild(banner);
      sendBtn.disabled = false;
      return;
    }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const data = await resp.json();
    const botMsg = {
      role: "bot",
      text: data.answer,
      sources: data.sources,
      was_refusal: data.was_refusal,
      question_id: data.question_id,
    };
    history.push(botMsg);
    renderMessage(botMsg);
    saveHistory(history);
  } catch (err) {
    removeTyping();
    renderMessage({
      role: "bot",
      text: "দুঃখিত, এই মুহূর্তে সার্ভারে সমস্যা হচ্ছে। একটু পরে আবার চেষ্টা করো।",
      was_refusal: true,
    });
    console.error(err);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

composer.addEventListener("submit", (e) => {
  e.preventDefault();
  sendQuestion(inputEl.value);
});

suggestedEl.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-q]");
  if (btn) sendQuestion(btn.dataset.q);
});

messagesEl.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-fb]");
  if (!btn) return;
  const qid = btn.dataset.qid;
  const feedback = btn.dataset.fb;

  const container = btn.parentElement;
  container.querySelectorAll("button").forEach((b) => b.classList.remove("active-up", "active-down"));
  btn.classList.add(feedback === "up" ? "active-up" : "active-down");

  try {
    await fetch(`${API_BASE_URL}/feedback`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question_id: Number(qid), feedback }),
    });
  } catch (err) {
    console.error("feedback failed", err);
  }
});

// Replay saved history on load (chat history persistence, F5 in the PRD)
if (history.length) {
  history.forEach(renderMessage);
} else {
  renderMessage({
    role: "bot",
    text: "আসসালামু আলাইকুম! আমি Biddabari AI Tutor। কোর্স, ফি, রুটিন বা যেকোনো বিষয়ে প্রশ্ন করো।",
  });
}
</script>
</body>
</html>
